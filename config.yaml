# ThermalETL region & processing config
region:
  name: poland
  # Poland + small margin (west, south, east, north)
  bbox: [13.5, 48.5, 24.5, 55.5]
  # ISO country code used for FIRMS yearly CSV fallback
  country_code: POL

h3:
  # Finer grid so zoom-in reaches ~90 km² cells (was ~250 km² at res 5).
  resolution: 6
  parent_fallback_levels: [5, 4]

harmonization:
  min_support: 5
  # Overlap years for estimating k (VIIRS / MODIS). End = last full calendar year at runtime.
  overlap_start_year: 2012
  # Sensors
  modis_source: MODIS_SP
  viirs_source: VIIRS_SNPP_SP
  modis_nrt: MODIS_NRT
  viirs_nrt: VIIRS_SNPP_NRT

filters:
  modis_confidence_min: 30
  viirs_confidence: ["n", "h"]

fetch:
  # FIRMS area API: valid day range is 1..5
  max_days_per_request: 5
  retry_max: 5
  retry_backoff_seconds: 5
  sleep_between_requests_seconds: 1.0
  nrt_days: 10
  # Historical start dates per sensor
  modis_start: "2000-11-01"
  viirs_start: "2012-01-01"

output:
  max_file_mb: 20
  # If monthly exceeds limit, tile by H3 res-2 parent
  tile_parent_res: 2

sample:
  # Tiny bbox around Warsaw for immediate frontend / CI
  name: sample
  bbox: [20.8, 52.1, 21.3, 52.4]
  # Enough overlap years so hold-out validation is meaningful for the demo
  years: [2018, 2019, 2020, 2021, 2022, 2023]
