[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermaletl"
version = "0.1.0"
description = "Harmonize NASA FIRMS MODIS and VIIRS hot spots into one consistent series"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "polars>=1.0.0",
  "pyarrow>=15.0.0",
  "h3>=4.0.0",
  "requests>=2.31.0",
  "pyyaml>=6.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
thermaletl = "thermaletl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
