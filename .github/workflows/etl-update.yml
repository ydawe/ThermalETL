name: ETL update (NRT)

# Weekly: refresh the standard product for the current (and previous) year,
# add the last N days of NRT detections, re-aggregate and commit if changed.
# Requires a prior etl-backfill.yml run (raw parquet in release "raw-{region}").

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require FIRMS_MAP_KEY
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::error::FIRMS_MAP_KEY secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/pyproject.toml
      - run: pip install -e etl
      - name: Resolve region
        run: echo "REGION=$(python -c 'import yaml; print(yaml.safe_load(open("config.yaml"))["region"]["name"])')" >> "$GITHUB_ENV"
      - name: Download stored raw data
        run: |
          mkdir -p raw
          if ! gh release download "raw-$REGION" --dir raw --pattern '*.parquet' --clobber; then
            echo "::error::Release raw-$REGION not found. Run the 'ETL backfill' workflow first."
            exit 1
          fi
      - name: Refresh recent standard data + NRT
        run: |
          Y=$(date -u +%Y)
          thermaletl run --config config.yaml --stage fetch --raw-dir raw \
            --years "$((Y - 1))-$Y" --refresh --nrt
      - name: Aggregate, harmonize, validate, export
        run: thermaletl run --config config.yaml --stage process --raw-dir raw
      - name: Store raw parquet
        run: gh release upload "raw-$REGION" raw/*.parquet --clobber
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          # meta.json always changes (generated_at); only commit when real data changed
          if git diff --cached --quiet -- . ':(exclude)web/public/data/*/meta.json'; then
            echo "No data changes."
          else
            git commit -m "data: weekly NRT update $REGION $(date -u +%F)"
            git pull --rebase
            git push
          fi
