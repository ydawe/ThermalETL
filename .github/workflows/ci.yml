name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Pytest
        run: pytest -q
      - name: Synthetic sample smoke run
        run: thermaletl run --config ../config.yaml --sample --synthetic --out "$RUNNER_TEMP/sample"

  web:
    name: Web lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint
        run: |
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
            npm run lint
          else
            echo "No ESLint config yet; skipping lint."
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build (static export)
        run: npm run build
